name: neow-bridge CI

on:
  push:
    paths: ["neow-bridge/**", ".github/workflows/bridge.yml"]
  pull_request:
    paths: ["neow-bridge/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 ModTheSpire.json
        run: python -c "import json;json.load(open('neow-bridge/src/main/resources/ModTheSpire.json'));print('ModTheSpire.json OK')"

  # 说明：完整 gradle 构建需要游戏本体 jar（desktop-1.0.jar，Steam 私有资源），
